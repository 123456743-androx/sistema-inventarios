<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Login</title>
    <link rel="stylesheet" href="/style.css">
</head>
<body>

<div class="container">

    <div class="imagen">
        <img src="/dragon.jpg">
    </div>

    <div class="formulario">

        <h2>Sistema de Inventario IMA</h2>

        <p>Correo electrónico</p>

        <form action="/login" method="POST">

            <input type="email" name="email" required>

            <p>Contraseña</p>

            <input type="password" name="password" required>

            <br>

            <button type="submit">
                Iniciar Sesión
            </button>

        </form>

        <a href="/registro">
            Crear Cuenta
        </a>

    </div>

</div>

</body>
</html>
